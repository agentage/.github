<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; font-weight:800; src:url('inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url('inter-600.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:500; src:url('inter-500.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1128px; height:191px; }
  .stage {
    position:relative; width:1128px; height:191px; overflow:hidden;
    background:
      radial-gradient(120% 180% at 50% 42%, rgba(243,165,43,0.16) 0%, rgba(243,165,43,0.05) 34%, rgba(10,14,23,0) 62%),
      radial-gradient(80% 140% at 82% 120%, rgba(91,155,239,0.10) 0%, rgba(10,14,23,0) 55%),
      #0a0e17;
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  /* subtle star specks */
  .stage::before {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 14% 30%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.2px 1.2px at 68% 22%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.1px 1.1px at 88% 64%, rgba(255,255,255,0.22), transparent),
      radial-gradient(1.2px 1.2px at 30% 76%, rgba(255,255,255,0.20), transparent),
      radial-gradient(1.0px 1.0px at 52% 12%, rgba(255,255,255,0.18), transparent);
  }
  .lockup { position:relative; display:flex; align-items:center; gap:26px; }
  .mark {
    width:96px; height:96px; border-radius:22px; display:block;
    box-shadow:0 0 34px 4px rgba(243,165,43,0.38), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .txt { display:flex; flex-direction:column; gap:9px; }
  .word { font-weight:800; font-size:52px; letter-spacing:-0.5px; color:#fff; line-height:1; }
  .tag { font-weight:600; font-size:21px; letter-spacing:0.1px; color:#c7cedb; line-height:1; }
  .tag b { color:#f5a623; font-weight:600; }
</style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <img class="mark" src="mark.png">
      <div class="txt">
        <div class="word">Agentage</div>
        <div class="tag">One memory. Every AI. <b>Owned by you.</b></div>
      </div>
    </div>
  </div>
</body>
</html>
