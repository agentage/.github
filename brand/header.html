<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; font-weight:800; src:url('inter-800.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url('inter-600.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1774px; height:444px; }
  .stage {
    position:relative; width:1774px; height:444px; overflow:hidden;
    background:#0a0e17; font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* centered scrim so the lockup stays legible over the plexus */
  .scrim { position:absolute; inset:0;
    background:radial-gradient(52% 90% at 50% 50%, rgba(6,8,14,0.72) 0%, rgba(6,8,14,0.30) 45%, rgba(6,8,14,0) 72%); }
  .lockup { position:relative; display:flex; align-items:center; gap:34px; }
  .mark { width:132px; height:132px; border-radius:30px;
    box-shadow:0 0 46px 6px rgba(243,165,43,0.42), 0 0 0 1px rgba(255,255,255,0.05); }
  .txt { display:flex; flex-direction:column; gap:16px; }
  .word { font-weight:800; font-size:78px; letter-spacing:-1px; color:#fff; line-height:1; }
  .tag { font-weight:600; font-size:30px; letter-spacing:0.2px; color:#c7cedb; line-height:1; }
  .tag b { color:#f5a623; font-weight:600; }
</style></head>
<body>
  <div class="stage">
    <img class="bg" src="plexus-bg.png">
    <div class="scrim"></div>
    <div class="lockup">
      <img class="mark" src="mark.png">
      <div class="txt">
        <div class="word">Agentage</div>
        <div class="tag">One memory. Every AI. <b>Owned by you.</b></div>
      </div>
    </div>
  </div>
</body></html>
